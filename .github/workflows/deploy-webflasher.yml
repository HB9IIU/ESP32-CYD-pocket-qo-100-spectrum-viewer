name: Build and deploy web flasher

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-webflasher.yml"
      - "partitions.csv"
      - "platformio.ini"
      - "scripts/**"
      - "src/**"
      - "webflasher/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build firmware
        run: pio run -e CYD28Inch -e CYD40Inch

      - name: Assemble browser-flashable images
        run: |
          mkdir -p _site
          cp webflasher/index.html _site/index.html
          for profile in CYD28Inch CYD40Inch; do
            if [ "$profile" = "CYD28Inch" ]; then
              suffix=28
            else
              suffix=40
            fi
            pio pkg exec -p tool-esptoolpy@2.41100.260830 -- esptool.py --chip esp32 merge_bin \
              -o "_site/firmware-${suffix}.bin" \
              --flash_mode dio \
              --flash_freq 40m \
              --flash_size 4MB \
              0x1000 ".pio/build/${profile}/bootloader.bin" \
              0x8000 ".pio/build/${profile}/partitions.bin" \
              0xe000 "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
              0x10000 ".pio/build/${profile}/firmware.bin"
            jq --arg profile "$profile" \
              --arg firmware "firmware-${suffix}.bin" \
              '.name = ("Pocket QO-100 Spectrum Viewer (" + $profile + ")")
               | .builds[0].parts[0].path = $firmware' \
              webflasher/manifest.json > "_site/manifest-${suffix}.json"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
