; Classic CYD 2.8-inch (ESP32-2432S028R) spectrum and waterfall.

[env:cyd]
platform  = espressif32@7.0.1
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600
board_build.partitions = partitions.csv

lib_deps = bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -std=gnu++17
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    ; Keep LCD on HSPI; the touchscreen uses its separate VSPI controller.
    -D USE_HSPI_PORT=1
    ; TFT_eSPI display SPI pins -- CYD 2.8" standard HSPI pads
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    ; COLOUR FIX: if the background is WHITE and waterfall PINK, replace
    ; the next line with: -D TFT_INVERSION_OFF=1
    ; Keep only ONE inversion flag, then rebuild and flash the firmware.
    -D TFT_INVERSION_ON=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; Fonts
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -mtext-section-literals
    -Wl,-T,scripts/spectrum_memory.ld

build_unflags = -std=gnu++11
