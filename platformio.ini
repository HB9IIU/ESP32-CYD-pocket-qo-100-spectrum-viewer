; CYD 2.8-inch and 4-inch spectrum/waterfall display profiles.

[platformio]
default_envs = CYD28Inch

[env]
platform  = espressif32@7.0.1
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600
board_build.partitions = partitions.csv

lib_deps = bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -std=gnu++17
    -D APP_VERSION=\"1.1\"
    -D USER_SETUP_LOADED=1
    ; Keep LCD on HSPI; the touchscreen uses its separate VSPI controller.
    -D USE_HSPI_PORT=1
    ; TFT_eSPI display SPI pins -- shared by both integrated CYD boards
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; Fonts
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -mtext-section-literals
    -Wl,-T,scripts/spectrum_memory.ld

build_unflags = -std=gnu++11

[env:CYD28Inch]
build_flags =
    ${env.build_flags}
    -D ILI9341_2_DRIVER=1
    -D TFT_BL=21
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    ; If the background appears white and the waterfall pink, switch to TFT_INVERSION_OFF.
    -D TFT_INVERSION_ON=1

[env:CYD40Inch]
build_flags =
    ${env.build_flags}
    -D CYD_4INCH=1
    -D ST7796_DRIVER=1
    -D TOUCH_CS=33
    -D SPI_TOUCH_FREQUENCY=2500000
    -D TFT_BL=27
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_INVERSION_OFF=1
